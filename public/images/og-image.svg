      <stop offset="0%" stop-color="#0F2744"/>
      <stop offset="55%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0b1c30"/>
    </linearGradient>
    <linearGradient id="acrylic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.55"/>
